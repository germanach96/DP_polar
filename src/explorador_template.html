<title>Explorador del parlamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola pantalla. Filtros a la izquierda, el hemiciclo y la evolución en el centro, volúmenes, trends y perfil político a la derecha.
   Todo cambia con la selección; nada obliga a hacer scroll de página. */
:root {
  --bg: #EFEFF3; --surface: #FFFFFF; --ink: #17161D; --ink-2: #4B4958; --muted: #6F6D81; --line: #DEDDE6; --soft: #EBEAF1;
  --chamber: #15141B; --chamber-ink: #F1F0F6; --chamber-muted: #A3A1B4; --chamber-line: #2F2D3A; --chamber-2: #211F2A;
  --empate: #B7BCC4; --focus: #6250d6; --pos: #1F7A5A; --neg: #B4412F; --epos: #7A5C3E; --sel: #17161D;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif; --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E0D12; --surface: #17161D; --ink: #ECEBF2; --ink-2: #B9B7C8; --muted: #8F8DA2; --line: #2A2933; --soft: #211F29;
  --chamber: #08070B; --chamber-line: #26242F; --chamber-2: #18171F; --empate: #6E7380; --focus: #9d90ff; --pos: #4CC79A; --neg: #F0806C; --epos: #D2A77C; --sel: #ECEBF2; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E0D12; --surface: #17161D; --ink: #ECEBF2; --ink-2: #B9B7C8; --muted: #8F8DA2; --line: #2A2933; --soft: #211F29;
  --chamber: #08070B; --chamber-line: #26242F; --chamber-2: #18171F; --empate: #6E7380; --focus: #9d90ff; --pos: #4CC79A; --neg: #F0806C; --epos: #D2A77C; --sel: #ECEBF2; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 13px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; overflow: hidden; }
::selection { background: color-mix(in oklab, var(--focus) 30%, transparent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
button, input { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* barra superior */
.top { background: var(--chamber); color: var(--chamber-ink); display: flex; align-items: center; gap: 14px; padding: 9px 16px; border-bottom: 1px solid var(--chamber-line); min-width: 0; }
.brand { font: 700 15px/1.05 var(--f-display); font-stretch: 105%; white-space: nowrap; display: flex; align-items: center; gap: 9px; }
.brand small { display: block; font: 500 11px/1.2 var(--f-body); color: var(--chamber-muted); font-stretch: 100%; }
.search { position: relative; flex: 1 1 320px; max-width: 520px; min-width: 0; }
.search input { width: 100%; background: var(--chamber-2); border: 1px solid var(--chamber-line); border-radius: 8px; padding: 8px 12px 8px 32px; color: var(--chamber-ink); }
.search input::placeholder { color: var(--chamber-muted); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--chamber-muted); }
.results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.22); max-height: 60vh; overflow: auto; z-index: 30; padding: 6px; }
.results .grp { font: 600 10.5px/1 var(--f-body); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; padding: 8px 8px 4px; }
.results button { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.results button:hover, .results button.on { background: var(--soft); }
.results button span:last-child { color: var(--muted); white-space: nowrap; }
.chips { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; min-width: 0; flex: 1 1 auto; scrollbar-width: none; }
.fchip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; background: var(--chamber-2); border: 1px solid var(--chamber-line); color: var(--chamber-ink); border-radius: 999px; padding: 4px 6px 4px 10px; font-size: 12px; cursor: pointer; }
.fchip b { font-weight: 500; color: var(--chamber-muted); }
.fchip i { font-style: normal; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: var(--chamber-line); font-size: 11px; }
.reset { white-space: nowrap; background: var(--chamber-ink); color: var(--chamber); border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; transition: transform .16s var(--ease-out), opacity .2s ease; }
.reset:active { transform: scale(.97); }
.reset[disabled] { opacity: .35; cursor: default; }

/* cuerpo */
.main { display: grid; grid-template-columns: 250px minmax(0, 1fr) 360px; gap: 10px; padding: 10px; min-height: 0; }
.col { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-height: 0; display: flex; flex-direction: column; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 0; }
.card-h h2 { font: 650 13px/1.2 var(--f-display); font-stretch: 95%; margin: 0; letter-spacing: 0; }
.card-h span { color: var(--muted); font-size: 11.5px; }

/* facetas */
.facets { overflow-y: auto; padding: 4px 4px 8px; flex: 1; }
.facet { border-bottom: 1px solid var(--soft); padding: 8px 8px; }
.facet:last-child { border-bottom: 0; }
.facet-h { display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: none; border: 0; width: 100%; padding: 0; font: 600 11px/1.2 var(--f-body); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.facet-h em { font-style: normal; color: var(--focus); font-weight: 700; letter-spacing: 0; }
.facet input { width: 100%; margin-top: 7px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 8px; font-size: 12px; }
.facet ul { list-style: none; margin: 6px 0 0; padding: 0; max-height: 168px; overflow-y: auto; }
.facet.closed ul, .facet.closed input { display: none; }
.facet li button { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 7px; align-items: center; width: 100%; background: none; border: 0; padding: 3px 4px; border-radius: 5px; cursor: pointer; text-align: left; font-size: 12.5px; }
.facet li button:hover { background: var(--soft); }
.facet li button .bx { width: 13px; height: 13px; border: 1.5px solid var(--muted); border-radius: 3px; display: grid; place-items: center; }
.facet li button[aria-pressed="true"] .bx { background: var(--ink); border-color: var(--ink); }
.facet li button[aria-pressed="true"] .bx::after { content: ""; width: 6px; height: 3px; border: solid var(--surface); border-width: 0 0 1.6px 1.6px; transform: rotate(-45deg) translate(1px, -1px); }
.facet li button .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.facet li button .ct { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11.5px; }
.facet li button.zero { opacity: .4; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }

/* hemiciclo */
.hemi-card { flex: 0 0 auto; }
.hemi-body { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 14px; padding: 6px 12px 12px; align-items: end; }
.hemi { width: 100%; height: auto; max-height: 30vh; display: block; }
.hemi .seat { transform-box: fill-box; transform-origin: center; animation: seatIn .4s var(--ease-out) both; animation-delay: var(--d, 0ms); cursor: pointer; }
.hemi .seat:hover { stroke: var(--ink); stroke-width: 1.5; }
@keyframes seatIn { from { opacity: 0; transform: scale(.4); } }
.hemi .big { font: 800 46px/1 var(--f-display); font-stretch: 85%; fill: var(--ink); font-variant-numeric: tabular-nums; }
.hemi .cap { font: 500 11px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; fill: var(--muted); }
.tally { display: grid; gap: 4px; }
.tally button { display: grid; grid-template-columns: 18px minmax(0, 1fr) 34px; gap: 6px; align-items: center; background: none; border: 0; padding: 2px 4px; border-radius: 5px; cursor: pointer; text-align: left; font-size: 12px; }
.tally button:hover { background: var(--soft); }
.tally button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tally button b { text-align: right; font-variant-numeric: tabular-nums; }
.tally button.zero { opacity: .35; }
.nb { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font: 700 10.5px/1 var(--f-body); font-style: normal; flex: none; }
.vbar { display: flex; height: 16px; border-radius: 4px; overflow: hidden; gap: 2px; margin: 0 12px 10px; }
.vbar i { display: block; min-width: 0; transition: flex-grow .5s var(--ease-out); }
.vlab { font-size: 11px; color: var(--muted); padding: 0 12px 4px; display: flex; justify-content: space-between; gap: 8px; }

/* pestañas */
.tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 7px 10px 9px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 12.5px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.pane { flex: 1; min-height: 0; overflow: auto; padding: 10px 12px 12px; }
.pane[hidden] { display: none; }

/* evolución */
.ctl { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-bottom: 6px; }
.lchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 9px 3px 6px; font-size: 11.5px; cursor: pointer; transition: opacity .2s ease; }
.lchip[aria-pressed="false"] { opacity: .45; }
.lchip .sw { width: 14px; height: 3px; border-radius: 2px; }
.chart { position: relative; height: calc(100% - 34px); min-height: 180px; }
.chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
.chart .grid line { stroke: var(--soft); } .chart .axis text { fill: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.chart .fut { fill: var(--soft); opacity: .6; }
.chart path.ln { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .cross { stroke: var(--muted); stroke-dasharray: 2 3; }
.tip { position: absolute; pointer-events: none; background: var(--chamber); color: var(--chamber-ink); font-size: 11.5px; padding: 7px 9px; border-radius: 7px; opacity: 0; transition: opacity .12s ease; z-index: 10; white-space: nowrap; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
.tip.on { opacity: 1; }
.tip table { border-collapse: collapse; } .tip td { padding: 1px 4px; } .tip td:last-child { text-align: right; font-variant-numeric: tabular-nums; }

/* tablas */
table.t { width: 100%; border-collapse: collapse; font-size: 12px; }
.t th { position: sticky; top: 0; background: var(--surface); font: 600 10.5px/1.2 var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; text-align: right; padding: 6px; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; }
.t th:first-child, .t td:first-child, .t th.l, .t td.l { text-align: left; }
.t td { padding: 5px 6px; border-bottom: 1px solid var(--soft); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.t td.desc { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.t tbody tr { cursor: pointer; } .t tbody tr:hover td { background: var(--soft); }
.t tr.hl td { font-weight: 700; }
.pn { display: inline-flex; align-items: center; gap: 6px; }
.up { color: var(--pos); } .dn { color: var(--neg); }

/* derecha */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); margin-top: 8px; border-radius: 0 0 12px 12px; overflow: hidden; }
.kpis div { background: var(--surface); padding: 8px 12px; }
.kpis b { display: block; font: 750 19px/1.1 var(--f-display); font-stretch: 90%; font-variant-numeric: tabular-nums; }
.kpis span { font-size: 11px; color: var(--muted); line-height: 1.3; display: block; }
.kpis em { font-style: normal; font-weight: 600; font-size: 11.5px; }
.who { padding: 4px 12px 0; }
.who h3 { font: 700 15px/1.2 var(--f-display); font-stretch: 95%; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who p { margin: 2px 0 0; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-tab { width: 100%; border-collapse: collapse; font-size: 12px; }
.tr-tab th { font: 600 10px/1.2 var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; text-align: right; padding: 4px 4px 6px; border-bottom: 1px solid var(--line); }
.tr-tab th:first-child { text-align: left; }
.tr-tab td { padding: 6px 4px; border-bottom: 1px solid var(--soft); text-align: right; font-variant-numeric: tabular-nums; }
.tr-tab td:first-child { text-align: left; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-tab td:first-child small { display: block; color: var(--muted); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; }
.tr-tab tr.me td { background: var(--soft); font-weight: 700; }
.tv { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.tv i { display: block; height: 3px; border-radius: 2px; }
.note { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
.cmp-tabs { display: flex; gap: 4px; margin-bottom: 6px; }
.cmp-tabs button { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 4px; font-size: 11.5px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.cmp-tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
svg.cmp { width: 100%; height: auto; display: block; max-height: 34vh; }
.cmp .ql { font: 600 10px/1 var(--f-body); fill: var(--muted); }
.cmp .al { font: 600 10.5px/1 var(--f-body); fill: var(--ink-2); }
.cmp .d { transition: transform .7s cubic-bezier(0.77, 0, 0.175, 1); }
.cmp .mk { transition: transform .7s cubic-bezier(0.77, 0, 0.175, 1); }
.cmp .cent { transition: transform .7s cubic-bezier(0.77, 0, 0.175, 1); }
.match { display: grid; gap: 4px; margin-top: 8px; }
.match .r { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; align-items: center; font-size: 12px; }
.match .r > span { color: var(--muted); font-size: 11.5px; }
.match .r b { display: inline-flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.empty { color: var(--muted); padding: 18px 4px; text-align: center; font-size: 12.5px; }

@media (max-width: 1180px) { .main { grid-template-columns: 220px minmax(0, 1fr) 320px; } .hemi-body { grid-template-columns: minmax(0, 1fr) 170px; } }
@media (max-width: 960px) {
  body { overflow: auto; } .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); } .facets { max-height: 280px; }
  .card.grow { min-height: 420px; } .top { flex-wrap: wrap; } .chips { order: 3; flex-basis: 100%; }
  .hemi-body { grid-template-columns: minmax(0, 1fr); }
  .chart { height: 300px; } .pane { max-height: 520px; }
}
@media (prefers-reduced-motion: reduce) {
  .hemi .seat { animation: none; } .cmp .d, .cmp .mk, .cmp .cent, .vbar i { transition: none; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><svg width="24" height="13" viewBox="0 0 22 12" aria-hidden="true"><path d="M1 11a10 10 0 0 1 20 0" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 11a5 5 0 0 1 10 0" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <div>Explorador del parlamento<small id="sub"></small></div></div>
    <div class="search"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Buscar EAN, descripción, línea, brand, casa, tamaño…" autocomplete="off" aria-label="Buscar en todos los filtros">
      <div class="results" id="results" hidden></div></div>
    <div class="chips" id="chips"></div>
    <button class="reset" id="reset" type="button" disabled><svg width="13" height="8" viewBox="0 0 22 12" aria-hidden="true"><path d="M1 11a10 10 0 0 1 20 0" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>Todo el parlamento</button>
  </header>
  <div class="main">
    <aside class="col"><div class="card" style="flex:1"><div class="card-h"><h2>Filtros</h2><span id="nsel"></span></div><div class="facets" id="facets"></div></div></aside>
    <section class="col">
      <div class="card hemi-card">
        <div class="card-h"><h2 id="hemi-t">El parlamento</h2><span>Pulsa un escaño para ver ese EAN</span></div>
        <div class="hemi-body"><svg class="hemi" id="hemi" role="img" aria-label="Hemiciclo de la selección"></svg><div class="tally" id="tally"></div></div>
        <div class="vlab"><span>Volumen de los últimos 12 meses (sep-25 a ago-26) de los EANs que elige cada partido</span><span id="vtot"></span></div>
        <div class="vbar" id="vbar"></div>
      </div>
      <div class="card grow" style="flex:1">
        <div class="tabs" role="tablist" id="ctabs">
          <button class="tab" role="tab" aria-selected="true" data-p="evo" type="button">Histórico y proyección</button>
          <button class="tab" role="tab" aria-selected="false" data-p="par" type="button">Partidos</button>
          <button class="tab" role="tab" aria-selected="false" data-p="lst" type="button">Lista de EANs</button>
        </div>
        <div class="pane" id="p-evo"><div class="ctl" id="lines"></div><div class="chart" id="chart"><svg id="csvg"></svg><div class="tip" id="ctip"></div></div></div>
        <div class="pane" id="p-par" hidden></div>
        <div class="pane" id="p-lst" hidden></div>
      </div>
    </section>
    <aside class="col">
      <div class="card"><div class="who" id="who"></div><div class="kpis" id="kpis"></div></div>
      <div class="card grow" style="flex:1">
        <div class="tabs" role="tablist" id="rtabs">
          <button class="tab" role="tab" aria-selected="true" data-p="tr" type="button">Trends</button>
          <button class="tab" role="tab" aria-selected="false" data-p="pol" type="button">Perfil político</button>
        </div>
        <div class="pane" id="p-tr"></div>
        <div class="pane" id="p-pol" hidden></div>
      </div>
    </aside>
  </div>
</div>

<script>
const D = /*__DATA__*/null;
const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const PARTIES = D.parties, COLS = D.colors, ORDER = D.order;            // ORDER = orden del hemiciclo (bloques)
const COL = Object.fromEntries(PARTIES.map((p, i) => [p, COLS[i]])); COL.Empate = getComputedStyle(document.documentElement).getPropertyValue("--empate").trim() || "#B7BCC4";
const NUM = Object.fromEntries(ORDER.map((p, i) => [p, i + 1]));
const lum = h => { const c = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
const ON = Object.fromEntries(PARTIES.map(p => [p, lum(COL[p]) > .3 ? "#17161D" : "#fff"]));
const nb = p => p === "Empate" ? `<i class="nb" style="background:var(--empate)">–</i>` : `<i class="nb" style="background:${COL[p]};color:${ON[p]}">${NUM[p]}</i>`;
const n0 = x => x == null || !isFinite(x) ? "–" : Math.round(x).toLocaleString("es-ES");
const nk = x => !isFinite(x) ? "–" : Math.abs(x) >= 1e6 ? (x / 1e6).toLocaleString("es-ES", { maximumFractionDigits: 2 }) + " M" : Math.abs(x) >= 1e4 ? Math.round(x / 1e3).toLocaleString("es-ES") + " k" : n0(x);
const pc = x => x == null || !isFinite(x) ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(Math.round(x * 100)) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const el = (t, a = {}) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
const MON = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const mlab = s => MON[+s.slice(5) - 1] + "-" + s.slice(2, 4);

/* ── datos */
const M = D.months, FM = D.fmonths, NM = M.length, EP0 = M.indexOf(D.epos_from), EPN = M.indexOf(D.epos_to) - EP0 + 1;
const ALL = D.eans.map(e => ({ ...e, hist: e.hist.map(v => v ?? 0), epos: e.epos.map(v => v ?? 0) }));

/* ── hemiciclo (misma geometría que src/votes_report.seats) */
function seats(n) {
  if (n <= 1) return [[[Math.PI / 2, .5]], 1.2];
  const opts = [];
  for (let rows = n <= 10 ? 1 : 2; rows < 40; rows++) for (let i = 20; i <= 1000; i++) {
    const d = i / 1000, r0 = 1 - (rows - 1) * d;
    if (rows > 1 && !(r0 >= 0.479 && r0 <= 0.641)) continue;
    if (rows === 1 && d < Math.PI / Math.max(n - 1, 1)) continue;
    let cap = 0;
    if (rows > 1) for (let j = 0; j < rows; j++) cap += Math.floor(Math.PI * (r0 + (1 - r0) * j / (rows - 1)) / d) + 1; else cap = Math.floor(Math.PI / d) + 1;
    if (cap >= n) opts.push([d, cap - n, rows]);
  }
  let ok = opts.filter(o => o[1] <= Math.max(1, 0.15 * n)); if (!ok.length) ok = [opts.reduce((a, b) => b[1] < a[1] ? b : a)];
  ok.sort((a, b) => b[0] - a[0] || b[1] - a[1] || b[2] - a[2]);
  const [d, , rows] = ok[0], R0 = 1 - (rows - 1) * d;
  const radii = rows === 1 ? [1] : Array.from({ length: rows }, (_, i) => R0 + (1 - R0) * i / (rows - 1));
  const cap = radii.map(r => Math.floor(Math.PI * r / d) + 1), sc = cap.reduce((a, b) => a + b, 0);
  const k = cap.map(c => Math.floor(n * c / sc));
  const rest = radii.map((_, i) => i).sort((a, b) => (n * cap[b] / sc - k[b]) - (n * cap[a] / sc - k[a]));
  for (const i of rest.slice(0, n - k.reduce((a, b) => a + b, 0))) k[i]++;
  const pts = [];
  radii.forEach((r, ri) => { for (let j = 0; j < k[ri]; j++) pts.push([k[ri] > 1 ? Math.PI * (1 - j / (k[ri] - 1)) : Math.PI / 2, r]); });
  pts.sort((a, b) => b[0] - a[0] || a[1] - b[1]);
  return [pts, Math.min(d, ...radii.map((r, i) => k[i] ? Math.PI * r / Math.max(k[i] - 1, 1) : Infinity))];
}
let hemiKey = "";

  const [pts, d] = seats(n);

  const ly9 = A.h.slice(NM - 11, NM - 2).reduce((a, b) => a + b, 0), tot = list.reduce((a, e) => a + e.v12, 0);
  const best = PARTIES.map((p, k) => [p, ne[k] ? err[k] / ne[k] : Infinity]).sort((a, b) => a[1] - b[1])[0];
  $("p-par").innerHTML = `<table class="t"><thead><tr><th>Partido</th><th>Escaños</th><th>Vol. 12M</th><th>Proyección oct–jun</th><th>vs año ant.</th><th>Error FY26</th></tr></thead><tbody>` +
    PARTIES.map((p, k) => { const f = A.fc[k].reduce((a, b) => a + b, 0); return `<tr class="${p === best[0] ? "hl" : ""}" data-p="${esc(p)}"><td><span class="pn">${nb(p)}${p}</span></td><td>${cnt[p] || 0}</td><td>${tot ? Math.round((vol[p] || 0) / tot * 100) + "%" : "–"}</td><td>${n0(f)}</td><td class="${f > ly9 ? "up" : "dn"}">${pc(ly9 ? f / ly9 - 1 : NaN)}</td><td>${ne[k] ? Math.round(err[k] / ne[k]) + "%" : "–"}</td></tr>`; }).join("") +
    `<tr><td><span class="pn"><i class="nb" style="background:var(--focus);color:#fff">★</i>Partido elegido por cada EAN</span></td><td>${list.length}</td><td>100%</td><td>${n0(A.el.reduce((a, b) => a + b, 0))}</td><td>${pc(ly9 ? A.el.reduce((a, b) => a + b, 0) / ly9 - 1 : NaN)}</td><td></td></tr></tbody></table>
    <p class="note">«Su proyección» = forecast de oct-26 a jun-27 desde la foto sep-26 si ese partido pronosticara todos los EANs de la selección, con los DAs futuros según la bandera. «Error medio FY26» = media de |forecast − real| / real en las 6 urnas de FY26 de cada EAN (tope 200%); en negrita, el que menos falla con esta selección. Pulsa un partido para filtrar sus EANs.</p>`;
}
$("p-par").addEventListener("click", e => { const r = e.target.closest("tr[data-p]"); if (r) setF("v", r.dataset.p, true); });

/* lista */
function drawList(list) {
  const cols = [["id", "EAN", 1], ["d", "Descripción", 1], ["h", "Casa", 1], ["l", "Línea", 1], ["s", "Tamaño/función", 1], ["age", "Edad"], ["v", "Partido", 1], ["v12", "Envíos 12M"], ["t12", "Trend 12M"], ["t6", "Trend 6M"], ["f9", "Proyección 9M"]];
  const [sk, sd] = S.sort;
  const L = list.slice().sort((a, b) => { const x = a[sk], y = b[sk]; return (typeof x === "string" ? x.localeCompare(y) : ((isFinite(x) ? x : -1e18) - (isFinite(y) ? y : -1e18))) * sd; }).slice(0, 600);
  $("p-lst").innerHTML = `<table class="t"><thead><tr>${cols.map(([k, l, left]) => `<th class="${left ? "l" : ""}" data-s="${k}">${l}${sk === k ? (sd > 0 ? " ↑" : " ↓") : ""}</th>`).join("")}</tr></thead><tbody>` +
    L.map(e => `<tr data-id="${e.id}"><td class="l">${e.id}</td><td class="l desc" title="${esc(e.d)}">${esc(e.d)}</td><td class="l">${esc(e.h)}</td><td class="l">${esc(e.l)}</td><td class="l">${esc(e.s)}</td><td>${e.age}</td><td class="l"><span class="pn">${nb(e.v)}${esc(e.v)}</span></td><td>${n0(e.v12)}</td><td class="${e.t12 > 0 ? "up" : "dn"}">${pc(e.t12)}</td><td class="${e.t6 > 0 ? "up" : "dn"}">${pc(e.t6)}</td><td>${n0(e.f9)}</td></tr>`).join("") +
    `</tbody></table>${list.length > 600 ? `<p class="note">Se muestran 600 de ${list.length}. Filtra para ver el resto.</p>` : ""}`;
}
$("p-lst").addEventListener("click", e => {
  const th = e.target.closest("th[data-s]"); if (th) { S.sort = [th.dataset.s, S.sort[0] === th.dataset.s ? -S.sort[1] : -1]; drawList(sel()); return; }
  const r = e.target.closest("tr[data-id]"); if (r) setEAN(r.dataset.id);
});

/* trends */
function grpTrends(list) {
  const h = list.reduce((a, e) => sum(a, e.hist), zeros(NM)), ep = list.reduce((a, e) => sum(a, eposOf(e)), zeros(EPN));
  return [trend(h, 6), trend(h, 12), trend(ep, 6), trend(ep, 12), list.length];
}
function drawTrends(list) {
  if (!list.length) { $("p-tr").innerHTML = `<p class="empty">Sin EANs en la selección</p>`; return; }
  const CEN = ALL.filter(e => e.cen);
  const rows = [[S.ean ? "Este EAN" : "La selección", "", grpTrends(list), true]];
  const c = k => common(list, k);
  const casa = c("h"), cat = c("c");
  if (c("l") !== null) rows.push(["Su línea", c("l"), grpTrends(CEN.filter(e => e.l === c("l")))]);
  if (c("b") !== null) rows.push(["Su brand", c("b"), grpTrends(CEN.filter(e => e.b === c("b")))]);
  if (c("s") !== null) rows.push([cat === "Makeup" ? "Su función" : "Su tamaño", c("s") + (casa ? " · " + casa : ""), grpTrends(CEN.filter(e => e.s === c("s") && (!casa || e.h === casa)))]);
  if (c("f") !== null) rows.push(["Su fase", c("f") + (casa ? " · " + casa : ""), grpTrends(CEN.filter(e => e.f === c("f") && (!casa || e.h === casa)))]);
  if (c("t") !== null) rows.push(["Su edad", c("t") + " meses" + (cat ? " · " + cat : ""), grpTrends(CEN.filter(e => e.t === c("t") && (!cat || e.c === cat)))]);
  if (casa !== null) rows.push(["Su casa", casa, grpTrends(CEN.filter(e => e.h === casa))]);
  if (cat !== null) rows.push(["Su categoría", cat, grpTrends(CEN.filter(e => e.c === cat))]);
  rows.push(["Todo el parlamento", "", grpTrends(CEN)]);
  const cell = x => { if (!isFinite(x)) return "<td>–</td>"; const w = Math.min(Math.abs(x), 1) * 46; return `<td><span class="tv"><span class="${x > 0 ? "up" : "dn"}">${pc(x)}</span><i style="width:${w}px;background:${x > 0 ? "var(--pos)" : "var(--neg)"}"></i></span></td>`; };
  $("p-tr").innerHTML = `<table class="tr-tab"><thead><tr><th></th><th>Envíos 6M</th><th>Envíos 12M</th><th>EPOS 6M</th><th>EPOS 12M</th></tr></thead><tbody>` +
    rows.map(([a, b, t, me]) => `<tr class="${me ? "me" : ""}"><td title="${esc(a + (b ? ": " + b : ""))}">${esc(a)}${b ? `<small>${esc(b)}</small>` : ""}</td>${t.slice(0, 4).map(cell).join("")}</tr>`).join("") + `</tbody></table>
    <p class="note">12M = últimos 12 meses (sep-25 a ago-26) frente a los 12 anteriores. 6M = últimos 6 meses frente a los mismos 6 del año anterior. Sep-26 no está cerrado y queda fuera; el EPOS llega hasta ${mlab(D.epos_to)}. Los grupos usan los EANs Central, como las reglas. Aparece un grupo cuando toda la selección comparte ese atributo.</p>`;
}

/* perfil político */
const CSPEC = [
  { k: "c1", t: "¿De dónde parto?", xl: ["Plana", "Con temporada"], yl: ["Reciente (6M)", "Lejana (12M)"] },
  { k: "c2", t: "¿A quién sigo?", xl: ["Individual", "Colectivo"], yl: ["Trend suave", "Trend completo"] },
  { k: "c3", t: "¿Cómo limpio?", xl: ["Deja los DAs", "Resta DAs"], yl: ["No suma cortes", "Suma cortes"] }];
function drawPol(list) {
  const pane = $("p-pol"), withPos = list.filter(e => e.pos);
  const sp = CSPEC[S.cmp], o = 2 * S.cmp, L = 1.14, w = 320, h = 300, ml = 22, mt = 8, PW = w - ml - 8, PH = h - mt - 22;
  const X = x => ml + (x + L) / (2 * L) * PW, Y = y => mt + (1 - (y + L) / (2 * L)) * PH;
  let svg = pane.querySelector("svg.cmp");
  if (!svg) {
    pane.innerHTML = `<div class="cmp-tabs" role="tablist">${CSPEC.map((c, i) => `<button type="button" role="tab" data-i="${i}" aria-selected="${i === S.cmp}">${c.t}</button>`).join("")}</div><svg class="cmp" viewBox="0 0 ${w} ${h}" role="img" aria-label="Brújula política de la selección"></svg><div class="match" id="match"></div><p class="note" id="pol-note"></p>`;
    svg = pane.querySelector("svg.cmp");
    const g0 = el("g");
    [[ml, mt, "var(--soft)"], [X(0), mt, "var(--bg)"], [ml, Y(0), "var(--bg)"], [X(0), Y(0), "var(--soft)"]].forEach(([x, y, f]) => g0.append(el("rect", { x, y, width: PW / 2, height: PH / 2, fill: f })));
    g0.append(el("line", { x1: X(0), x2: X(0), y1: mt, y2: mt + PH, stroke: "var(--line)" }), el("line", { x1: ml, x2: ml + PW, y1: Y(0), y2: Y(0), stroke: "var(--line)" }));
    ["xl0", "xl1", "yl0", "yl1"].forEach(id => { const t = el("text", { class: "al", id }); g0.append(t); });
    svg.append(g0, el("g", { id: "gd" }), el("g", { id: "gm" }));
    PARTIES.forEach(p => { const g = el("g", { class: "mk" }); g.dataset.p = p; g.append(el("circle", { r: 9, fill: COL[p], stroke: "var(--surface)", "stroke-width": 2 })); const t = el("text", { "text-anchor": "middle", dy: 3.5, "font-size": 10, "font-weight": 700, fill: ON[p] }); t.textContent = NUM[p]; g.append(t, Object.assign(el("title"), { textContent: p })); svg.querySelector("#gm").append(g); });
    const c = el("g", { class: "cent" }); c.append(el("path", { d: "M0 -11L11 0L0 11L-11 0Z", fill: "var(--sel)", stroke: "var(--surface)", "stroke-width": 2 }), Object.assign(el("title"), { textContent: "Centro de la selección" })); svg.append(c);
    pane.querySelector(".cmp-tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.cmp = +b.dataset.i; pane.querySelectorAll(".cmp-tabs button").forEach(x => x.setAttribute("aria-selected", +x.dataset.i === S.cmp)); drawPol(sel()); });
  }
  const set = (id, a, txt) => { const t = svg.querySelector("#" + id); for (const k in a) t.setAttribute(k, a[k]); t.textContent = txt; };
  set("xl0", { x: ml, y: h - 6 }, "← " + sp.xl[0]); set("xl1", { x: ml + PW, y: h - 6, "text-anchor": "end" }, sp.xl[1] + " →");
  set("yl0", { transform: `translate(${ml - 8} ${mt + PH}) rotate(-90)` }, "← " + sp.yl[0]); set("yl1", { transform: `translate(${ml - 8} ${mt}) rotate(-90)`, "text-anchor": "end" }, sp.yl[1] + " →");
  const gd = svg.querySelector("#gd"); gd.replaceChildren();
  const vmax = Math.max(1, ...withPos.map(e => e.v12));
  withPos.slice().sort((a, b) => b.v12 - a.v12).slice(0, 900).forEach(e => {
    const c = el("circle", { r: (S.ean ? 7 : 1.6 + 4.2 * Math.sqrt(e.v12 / vmax)).toFixed(2), fill: COL[e.v], "fill-opacity": S.ean ? .95 : .6, stroke: "var(--surface)", "stroke-width": .5, class: "d" });
    c.style.transform = `translate(${X(e.pos[o])}px, ${Y(e.pos[o + 1])}px)`; c.append(Object.assign(el("title"), { textContent: `${e.d} · ${e.v}` })); gd.append(c);
  });
  svg.querySelectorAll(".mk").forEach(g => { const [x, y] = D.markers[sp.k][g.dataset.p]; g.style.transform = `translate(${X(x)}px, ${Y(y)}px)`; });
  // centro de la selección (ponderado por volumen) en las 3 brújulas
  const wsum = withPos.reduce((a, e) => a + Math.max(e.v12, 1), 0);
  const cen = [0, 1, 2, 3, 4, 5].map(j => withPos.reduce((a, e) => a + e.pos[j] * Math.max(e.v12, 1), 0) / (wsum || 1));
  const ce = svg.querySelector(".cent"); ce.style.opacity = withPos.length ? 1 : 0; ce.style.transform = `translate(${X(cen[o])}px, ${Y(cen[o + 1])}px)`;
  // partido más parecido: distancia en las 6 coordenadas a la posición de cada partido
  const dist = PARTIES.map(p => [p, Math.hypot(...["c1", "c2", "c3"].flatMap((k, j) => [cen[2 * j] - D.markers[k][p][0], cen[2 * j + 1] - D.markers[k][p][1]]))]).sort((a, b) => a[1] - b[1]);
  const cnt = {}; list.forEach(e => cnt[e.v] = (cnt[e.v] || 0) + 1);
  const maj = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  const err = PARTIES.map((p, k) => { const xs = list.map(e => e.err && e.err[k]).filter(x => x != null); return [p, xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : Infinity]; }).sort((a, b) => a[1] - b[1]);
  $("match").innerHTML = withPos.length ? [
    ["Su perfil se parece a", dist[0][0], "el partido más cercano en las 3 brújulas"],
    ["Elige", maj ? maj[0] : "–", maj ? `${maj[1]} de ${list.length} EANs` : ""],
    ["Le iría mejor con", isFinite(err[0][1]) ? err[0][0] : "–", isFinite(err[0][1]) ? `menor error medio en FY26 (${Math.round(err[0][1])}%)` : "sin urnas propias en FY26"]
  ].map(([a, p, s]) => `<div class="r"><span>${a}</span><b title="${esc(s)}">${p in COL ? nb(p) : ""}${esc(p)} <small style="font-weight:400;color:var(--muted)">${esc(s)}</small></b></div>`).join("")
    : `<p class="empty">Ningún EAN de la selección tiene posición en las brújulas (necesita historia y real en FY26).</p>`;
  $("pol-note").innerHTML = `Punto = EAN (color = partido elegido; tamaño = envíos 12M). Rombo = centro de la selección, ponderado por volumen. Círculo numerado = partido por su receta. Posiciones con lo que vio cada EAN en FY26 (foto sep-25 → real oct-25 a jun-26). ${withPos.length} de ${list.length} EANs tienen posición.`;
}

/* pestañas */
function tabs(id, pre) {
  $(id).addEventListener("click", e => {
    const b = e.target.closest(".tab"); if (!b) return;
    $(id).querySelectorAll(".tab").forEach(t => { t.setAttribute("aria-selected", t === b); $(pre + t.dataset.p).hidden = t !== b; });
    if (b.dataset.p === "evo") drawChart();
  });
}
tabs("ctabs", "p-"); tabs("rtabs", "p-");

/* ── render */
function render() {
  const list = sel(), A = aggregate(list);
  $("reset").disabled = !hasFilter();
  $("chips").innerHTML = (S.ean ? [["ean", S.ean, "EAN " + S.ean]] : []).concat(Object.entries(S.f).flatMap(([k, s]) => [...s].map(v => [k, v, lab(k, v)])))
    .map(([k, v, l]) => `<button class="fchip" type="button" data-k="${esc(k)}" data-v="${esc(v)}">${k !== "ean" ? `<b>${FACETS.find(f => f[0] === k)[1]}:</b> ` : ""}${esc(l)}<i aria-label="Quitar">×</i></button>`).join("");
  $("nsel").textContent = `${list.length} de ${PARL.length} EANs`;
  $("hemi-t").textContent = hasFilter() ? (S.ean ? "Su escaño" : "El parlamento de la selección") : "El parlamento";
  drawHemi(list); drawTally(list); drawFacets(list); drawWho(list, A); drawChart(A); drawParties(list, A); drawList(list); drawTrends(list); drawPol(list);
}
$("sub").textContent = `Foto sep-26 · proyección oct-26 a jun-27 · voto con FY26 · ${PARL.length} EANs`;
drawLines(); render();
</script>

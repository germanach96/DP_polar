<title>Explorador del parlamento</title>
<style>
@font-face { font-family: "Inter Var"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(data:font/woff2;base64,/*__FONT__*/) format("woff2"); }
/* Layout: una app de macOS a pantalla completa. Barra de título sobre el lienzo; paneles blancos (filtros | parlamento + histórico | selección)
   y, encima, ventanas de EAN o de partido en material translúcido que nacen del escaño pulsado, se lanzan con inercia y se asientan con un muelle. */
:root {
  --bg: #F5F5F7; --panel: #FFFFFF; --panel-2: #FAFAFC; --fill: rgba(120,120,128,.12); --fill-2: rgba(120,120,128,.07);
  --ink: #1D1D1F; --ink-2: #424245; --muted: #6E6E73; --hair: rgba(0,0,0,.09);
  --accent: #1D1D1F; --accent-ink: #FFFFFF; --accent-soft: rgba(0,0,0,.06);   /* acento grafito de macOS: el azul de sistema se confundía con el partido Media 6M prudente */
  --glass: rgba(255,255,255,.97); --glass-edge: rgba(0,0,0,.10); --glass-hi: rgba(255,255,255,.75); --thumb: #FFFFFF;
  --tl-red: #FF5F57; --tl-yel: #FEBC2E; --tl-off: #D5D5D8; --tl-glyph: rgba(0,0,0,.55);
  --empate: #B7BCC4; --good: #0ca30c; --critical: #d03b3b;
  --sh-panel: 0 1px 1px rgba(0,0,0,.02), 0 6px 20px rgba(0,0,0,.04);
  --sh-win: 0 0 0 .5px var(--glass-edge), 0 2px 6px rgba(0,0,0,.05), 0 18px 44px rgba(0,0,0,.12);
  --sh-top: 0 0 0 .5px var(--glass-edge), 0 4px 10px rgba(0,0,0,.06), 0 24px 56px rgba(0,0,0,.16);
  --sh-lift: 0 0 0 .5px var(--glass-edge), 0 8px 18px rgba(0,0,0,.08), 0 36px 80px rgba(0,0,0,.22);
  --sh-thumb: 0 0 0 .5px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.12), 0 3px 8px rgba(0,0,0,.06);
  /* alias que usa el JS */
  --paper: var(--panel); --surface: var(--panel); --soft: var(--fill-2); --line: var(--hair);
  --r-panel: 20px; --r-win: 14px; --r-ctl: 10px; --r-s: 7px; --pill: 980px;
  --f: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter Var", system-ui, sans-serif;
  --f-d: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter Var", system-ui, sans-serif;
  --f-code: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-io: cubic-bezier(0.77, 0, 0.175, 1); --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --panel: #1C1C1E; --panel-2: #232325; --fill: rgba(118,118,128,.24); --fill-2: rgba(118,118,128,.14);
  --ink: #F5F5F7; --ink-2: #D2D2D7; --muted: #98989D; --hair: rgba(255,255,255,.10);
  --accent: #F5F5F7; --accent-ink: #1D1D1F; --accent-soft: rgba(255,255,255,.12);
  --glass: rgba(40,40,42,.96); --glass-edge: rgba(255,255,255,.12); --glass-hi: rgba(255,255,255,.08); --thumb: #636366;
  --tl-off: #4A4A4E; --tl-glyph: rgba(0,0,0,.6); --empate: #6E7380;
  --sh-panel: 0 0 0 .5px rgba(255,255,255,.06);
  --sh-win: 0 0 0 .5px var(--glass-edge), 0 2px 6px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,.55);
  --sh-top: 0 0 0 .5px var(--glass-edge), 0 4px 10px rgba(0,0,0,.45), 0 24px 56px rgba(0,0,0,.65);
  --sh-lift: 0 0 0 .5px var(--glass-edge), 0 8px 18px rgba(0,0,0,.5), 0 36px 80px rgba(0,0,0,.75);
  --sh-thumb: 0 0 0 .5px rgba(255,255,255,.06), 0 1px 3px rgba(0,0,0,.5);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #000000; --panel: #1C1C1E; --panel-2: #232325; --fill: rgba(118,118,128,.24); --fill-2: rgba(118,118,128,.14);
  --ink: #F5F5F7; --ink-2: #D2D2D7; --muted: #98989D; --hair: rgba(255,255,255,.10);
  --accent: #F5F5F7; --accent-ink: #1D1D1F; --accent-soft: rgba(255,255,255,.12);
  --glass: rgba(40,40,42,.96); --glass-edge: rgba(255,255,255,.12); --glass-hi: rgba(255,255,255,.08); --thumb: #636366;
  --tl-off: #4A4A4E; --tl-glyph: rgba(0,0,0,.6); --empate: #6E7380;
  --sh-panel: 0 0 0 .5px rgba(255,255,255,.06);
  --sh-win: 0 0 0 .5px var(--glass-edge), 0 2px 6px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,.55);
  --sh-top: 0 0 0 .5px var(--glass-edge), 0 4px 10px rgba(0,0,0,.45), 0 24px 56px rgba(0,0,0,.65);
  --sh-lift: 0 0 0 .5px var(--glass-edge), 0 8px 18px rgba(0,0,0,.5), 0 36px 80px rgba(0,0,0,.75);
  --sh-thumb: 0 0 0 .5px rgba(255,255,255,.06), 0 1px 3px rgba(0,0,0,.5);
  color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 13px/1.45 var(--f); letter-spacing: -.003em; font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow: hidden; }
::selection { background: var(--accent-soft); color: var(--ink); }
:focus-visible { outline: none; box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--accent) 45%, transparent); }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
input { caret-color: var(--accent); }
* { scrollbar-width: thin; scrollbar-color: var(--fill) transparent; }
svg { display: block; }
.press { transition: transform 160ms var(--ease-out), background-color 160ms ease, color 160ms ease, opacity 160ms ease, box-shadow 160ms ease; }
.press:active { transform: scale(.97); }

/* ── la ventana: lienzo gris con paneles */
.desk { position: fixed; inset: 0; display: grid; grid-template-columns: 256px minmax(0, 1fr) 372px; grid-template-rows: auto auto minmax(0, 1fr);
  grid-template-areas: "top top top" "fil parl sel" "fil evo sel"; gap: 14px; padding: 6px 18px 18px; }
.sheet { background: var(--panel); border-radius: var(--r-panel); box-shadow: var(--sh-panel); min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.sheet-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 16px 18px 2px; }
.sheet-h h2 { margin: 0; font: 600 17px/1.2 var(--f-d); letter-spacing: -.022em; }
.sheet-h .hint { color: var(--muted); font-size: 12px; text-align: right; }
.strip { grid-area: top; flex-direction: row; align-items: center; gap: 16px; padding: 12px 2px 4px; background: none; box-shadow: none; border-radius: 0; overflow: visible; }
.fil { grid-area: fil; } .parl { grid-area: parl; } .evo { grid-area: evo; } .selc { grid-area: sel; }

/* barra de título */
.brand { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.brand b { font: 700 24px/1.08 var(--f-d); letter-spacing: -.028em; white-space: nowrap; }
.brand small { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search { position: relative; flex: 1 1 300px; max-width: 440px; min-width: 0; }
.search input { width: 100%; height: 34px; border: 0; background: var(--panel); box-shadow: var(--sh-panel), inset 0 0 0 .5px var(--hair); border-radius: var(--r-ctl);
  padding: 0 12px 0 32px; transition: box-shadow 200ms ease; }
.search input:focus { outline: none; box-shadow: var(--sh-panel), 0 0 0 3.5px color-mix(in srgb, var(--accent) 40%, transparent); }
.search input::placeholder { color: var(--muted); }
.search input::-webkit-search-cancel-button { filter: grayscale(1); opacity: .5; }
.search > svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.results { position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: var(--glass); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
  border-radius: 12px; box-shadow: var(--sh-lift); max-height: 60vh; overflow: auto; z-index: 60; padding: 5px;
  transform-origin: top center; transition: opacity 180ms var(--ease-out), transform 220ms var(--ease-out), filter 180ms var(--ease-out); }
@starting-style { .results { opacity: 0; transform: translateY(-6px) scale(.97); filter: blur(4px); } }
.results .grp { font: 600 11.5px/1 var(--f); color: var(--muted); padding: 10px 9px 5px; }
.results button { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 6px 9px; border-radius: var(--r-s); }
.results button.on { background: var(--accent); color: var(--accent-ink); }
.results button span:last-child { color: var(--muted); white-space: nowrap; }
.results button.on span:last-child { color: inherit; opacity: .8; }
.chips { display: flex; gap: 6px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.fchip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; border: 0; background: var(--fill); border-radius: var(--pill); padding: 5px 8px 5px 11px; font-size: 12.5px; }
.fchip b { font-weight: 400; color: var(--muted); }
.fchip i { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--fill); color: var(--ink-2); }
.btn { white-space: nowrap; border: 0; background: var(--accent); color: var(--accent-ink); border-radius: var(--pill); padding: 7px 15px; font-weight: 500; font-size: 13px; }
.btn.ghost { background: var(--fill); color: var(--ink); }
.btn[disabled] { opacity: .4; cursor: default; }
.btn[disabled]:active { transform: none; }

/* filtros: barra lateral */
.facets { overflow-y: auto; padding: 4px 10px 12px; flex: 1; }
.facet { padding: 8px 6px; }
.facet + .facet { box-shadow: inset 0 .5px 0 var(--hair); }
.facet-h { display: flex; justify-content: space-between; align-items: center; background: none; border: 0; width: 100%; padding: 2px 2px; font: 600 13px/1.25 var(--f); text-align: left; border-radius: var(--r-s); }
.facet-h em { font-style: normal; font-weight: 600; background: var(--accent); color: var(--accent-ink); border-radius: var(--pill); padding: 0 6px; margin-left: 6px; font-size: 11px; line-height: 17px; display: inline-block; }
.facet-h svg { color: var(--muted); transition: transform 260ms var(--ease-out); }
.facet:not(.closed) .facet-h svg { transform: rotate(90deg); }
.facet input { width: 100%; margin-top: 8px; border: 0; background: var(--fill-2); border-radius: var(--r-s); padding: 6px 9px; font-size: 12.5px; }
.facet input:focus { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }
.facet ul { list-style: none; margin: 6px 0 0; padding: 0; max-height: 180px; overflow-y: auto; }
.facet[data-k="v"] ul { max-height: none; }
.facet.closed ul, .facet.closed input { display: none; }
.facet li button { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; background: none; border: 0; padding: 4px 6px; border-radius: var(--r-s); text-align: left; font-size: 13px; }
.facet li .bx { width: 15px; height: 15px; border-radius: 4px; background: var(--panel); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 22%, transparent); display: grid; place-items: center; transition: background-color 160ms ease, box-shadow 160ms ease; }
.facet li [aria-pressed="true"] .bx { background: var(--accent); box-shadow: none; }
.facet li [aria-pressed="true"] .bx::after { content: ""; width: 7px; height: 3.5px; border: solid var(--accent-ink); border-width: 0 0 1.8px 1.8px; transform: rotate(-45deg) translate(1px, -1px); }
.facet li .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.facet li .ct { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.facet li .zero { opacity: .4; }
.sq { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }

/* parlamento */
.parl-body { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 22px; padding: 8px 18px 4px; align-items: center; }
.hemi { width: 100%; height: auto; max-height: 31vh; overflow: visible; }
.hemi .seat { cursor: pointer; transition: stroke-width 160ms var(--ease-out); stroke: transparent; }
.hemi .seat.open { stroke: var(--ink); stroke-width: 2.4; }
.hemi .seat.hot { stroke: var(--ink); stroke-width: 3.6; }
.hemi .seats { animation: rise 520ms var(--ease-out) both; transform-origin: 50% 100%; }
@keyframes rise { from { opacity: 0; transform: scale(.96); filter: blur(6px); } }
.hemi .big { font: 700 58px/1 var(--f-d); letter-spacing: -.035em; fill: var(--ink); font-variant-numeric: tabular-nums; }
.hemi .cap { font: 500 12.5px/1 var(--f); fill: var(--muted); }
.tally { display: flex; flex-direction: column; gap: 1px; }
.tally button { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 9px; align-items: center; background: none; border: 0; border-radius: 8px; padding: 5px 8px; text-align: left; font-size: 13px; }
.tally button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tally button b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tally button.zero { opacity: .4; }
.tally button.open { background: var(--fill); }
.tally button.hot { background: var(--accent-soft); }
.tally .sq { width: 12px; height: 12px; border-radius: 50%; }
.vol { padding: 8px 18px 18px; }
.vlab { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.vlab b { color: var(--ink); white-space: nowrap; font-weight: 600; }
.vbar { display: flex; height: 8px; gap: 2px; border-radius: 4px; overflow: hidden; }
.vbar i { display: block; min-width: 0; transition: flex-grow 420ms var(--ease-out); }

/* pestañas: control segmentado con cursor que se desliza */
.tabs { position: relative; display: flex; gap: 0; margin: 14px 18px 0; padding: 2px; background: var(--fill); border-radius: 9px; flex: none; }
.tab { position: relative; z-index: 1; flex: 1; background: none; border: 0; padding: 5px 10px; border-radius: 7px; font-weight: 500; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; transition: color 200ms ease; }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; }
.tabs .thumb { position: absolute; z-index: 0; top: 2px; bottom: 2px; left: 0; width: 0; border-radius: 7px; background: var(--thumb); box-shadow: var(--sh-thumb);
  transition: transform 340ms var(--ease-sheet), width 340ms var(--ease-sheet); pointer-events: none; }
.pane { flex: 1; min-height: 0; overflow: auto; padding: 14px 18px 16px; }

/* gráfico */
.ctl { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.lchip { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--fill-2); border-radius: var(--pill); padding: 4px 10px 4px 8px; font-size: 12px; }
.lchip[aria-pressed="false"] { color: var(--muted); background: transparent; box-shadow: inset 0 0 0 1px var(--hair); }
.lchip[aria-pressed="false"] .sq, .lchip[aria-pressed="false"] svg { opacity: .3; }
#p-evo:not([hidden]) { display: flex; flex-direction: column; }
.chart { position: relative; flex: 1; min-height: 180px; }
.chart svg { width: 100%; height: 100%; overflow: visible; }
.grid line { stroke: var(--hair); stroke-width: 1; } .axis text { fill: var(--muted); font-size: 11px; font-family: var(--f); font-variant-numeric: tabular-nums; }
.fut { fill: var(--fill-2); }
.futlab { fill: var(--muted); font-size: 11px; font-weight: 600; }
path.ln { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.cross { stroke: var(--muted); stroke-dasharray: 2 3; }
.hit { fill: var(--panel); stroke-width: 2; }
.tip, .ftip { pointer-events: none; background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); color: var(--ink);
  font-size: 12px; border-radius: 10px; opacity: 0; transform: scale(.97); transition: opacity 140ms ease, transform 160ms var(--ease-out); box-shadow: var(--sh-win); }
.tip { position: absolute; padding: 8px 11px; z-index: 5; white-space: nowrap; transform-origin: top left; }
.tip.on, .ftip.on { opacity: 1; transform: none; }
.tip table { border-collapse: collapse; margin-top: 4px; } .tip td { padding: 1px 4px; } .tip td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.ftip { position: fixed; z-index: 90; padding: 7px 10px; max-width: 320px; transform-origin: top left; }
.ftip b { display: block; font-weight: 600; } .ftip span { color: var(--muted); }

/* tablas */
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.t th { position: sticky; top: 0; background: var(--panel); font: 600 11.5px/1.2 var(--f); color: var(--muted); text-align: right; padding: 7px 6px; box-shadow: inset 0 -.5px 0 var(--hair); cursor: pointer; white-space: nowrap; }
.t th:first-child, .t td:first-child, .t .l { text-align: left; }
.t td { padding: 7px 6px; box-shadow: inset 0 -.5px 0 var(--hair); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.t td.desc { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
.t td.code { font: 12px var(--f-code); color: var(--ink-2); }
.t tbody tr { cursor: pointer; transition: background-color 120ms ease; }
.t tr.hl td { font-weight: 600; }
.pn { display: inline-flex; align-items: center; gap: 7px; }
.dlt { display: inline-flex; align-items: center; gap: 4px; justify-content: flex-end; font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--muted); margin: 10px 0 0; line-height: 1.5; max-width: 64ch; }
.empty { color: var(--muted); padding: 18px 4px; text-align: center; }

/* selección: lista agrupada de ajustes */
.who { padding: 18px 18px 6px; }
.who h3 { margin: 0; font: 700 21px/1.15 var(--f-d); letter-spacing: -.025em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spec { margin: 8px 18px 4px; background: var(--fill-2); border-radius: 12px; padding: 0 12px; }
.spec div { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 2px 12px; padding: 9px 0; }
.spec div + div { box-shadow: inset 0 .5px 0 var(--hair); }
.spec dt { font-size: 13px; font-weight: 500; } .spec dt small { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); }
.spec dd { margin: 0; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.spec dd b { font: 600 17px/1.1 var(--f-d); letter-spacing: -.02em; }
.spec dd .dlt { display: inline-flex; margin-left: 8px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.tr-tab { width: 100%; border-collapse: collapse; font-size: 12.5px; table-layout: fixed; }
.tr-tab th { font: 600 11.5px/1.2 var(--f); color: var(--muted); text-align: right; padding: 4px 3px 7px; box-shadow: inset 0 -.5px 0 var(--hair); }
.tr-tab th:first-child { width: 36%; text-align: left; }
.tr-tab td { padding: 7px 3px; box-shadow: inset 0 -.5px 0 var(--hair); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tr-tab td:first-child { text-align: left; white-space: normal; line-height: 1.3; }
.tr-tab td:first-child small { display: block; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr-tab tr.me td { background: var(--fill-2); font-weight: 600; }
.seg { display: flex; margin-bottom: 12px; padding: 2px; background: var(--fill); border-radius: 9px; }
.seg button { flex: 1; border: 0; background: none; padding: 5px 4px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); transition: background-color 220ms ease, box-shadow 220ms ease, color 220ms ease; }
.seg button[aria-selected="true"] { background: var(--thumb); color: var(--ink); font-weight: 600; box-shadow: var(--sh-thumb); }
svg.cmp { width: 100%; height: auto; max-height: 34vh; }
.cmp .al { font: 500 12px/1 var(--f); fill: var(--ink-2); }
.cmp .d { transition: transform 700ms var(--ease-io); }
.cmp .mk, .cmp .cent { transition: transform 700ms var(--ease-io); }
.match { display: grid; gap: 8px; margin-top: 14px; background: var(--fill-2); border-radius: 12px; padding: 12px; }
.match .r { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 12.5px; }
.match .r > span { color: var(--muted); font-size: 12px; }
.match .r b { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 7px; min-width: 0; font-weight: 600; }
.match .r small { flex-basis: 100%; padding-left: 19px; font-weight: 400; color: var(--muted); font-size: 12px; }

/* ── ventanas flotantes */
#layer { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
.fic { position: absolute; left: 0; top: 0; width: 340px; pointer-events: auto; will-change: transform; -webkit-user-select: none; user-select: none; }
.fic .ttl, .fic h4 { -webkit-user-select: text; user-select: text; }
.fic-in { background: var(--glass); -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%);
  border-radius: var(--r-win); box-shadow: inset 0 .5px 0 var(--glass-hi), var(--sh-win); overflow: hidden;
  transition: box-shadow 260ms var(--ease-out), scale 260ms var(--ease-out); }

function drawChart(A = lastA) {

  const X = i => ml + i / (T - 1) * (W - ml - mr), fx = i => NM + 1 + i;

  frag.append(g, ax, ft);
  series.forEach(s => {

    front(c);

}
function closeCard(key) {

    const src = srcOf(c), fi = c.el.firstElementChild;
    if (src) { const s = src.getBoundingClientRect(), r = c.el.getBoundingClientRect(); fi.style.transformOrigin = `${s.left + s.width / 2 - r.left}px ${s.top + s.height / 2 - r.top}px`; }
    fi.animate([{ opacity: 1, transform: "none", filter: "blur(0)" }, { opacity: 0, transform: "scale(.7)", filter: "blur(6px)" }], { duration: 200, easing: "cubic-bezier(0.23, 1, 0.32, 1)" }).onfinish = done;
  }

}
function syncCards() {
  const eans = new Set([...CARDS.values()].filter(c => c.type === "ean").map(c => c.id)), parts = new Set([...CARDS.values()].filter(c => c.type === "party").map(c => c.id));
  for (const s of $("hemi").querySelectorAll(".seat")) s.classList.toggle("open", eans.has(s.dataset.id));
  for (const b of $("tally").querySelectorAll("button[data-p]")) b.classList.toggle("open", parts.has(b.dataset.p));
  $("tray").hidden = NARROW.matches || !CARDS.size;
  $("same").parentElement.hidden = [...CARDS.values()].filter(c => c.type === "ean").length < 2;
}
// la ventana y su escaño se reconocen: al pasar por encima de una, su escaño se ilumina
const srcOf = c => c.type === "ean" ? $("hemi").querySelector(`.seat[data-id="${c.id}"]`) : $("tally").querySelector(`button[data-p="${CSS.escape(c.id)}"]`);
function hot(c, on) { const s = c && srcOf(c); if (s) s.classList.toggle("hot", !!on); }
$("layer").addEventListener("pointerover", e => { const k = e.target.closest(".fic")?.dataset.key; if (k) hot(CARDS.get(k), true); });
$("layer").addEventListener("pointerout", e => { const f = e.target.closest(".fic"); if (f && !f.contains(e.relatedTarget)) hot(CARDS.get(f.dataset.key), false); });
$("layer").addEventListener("pointerdown", ev => {
  const card = ev.target.closest(".fic"); if (!card) return; const c = CARDS.get(card.dataset.key); front(c);
  const h = ev.target.closest(".fic-h"); if (!h || ev.target.closest(".ib, .tlb") || NARROW.matches || !ev.isPrimary) return;
  ev.preventDefault(); h.setPointerCapture(ev.pointerId); stopSpring(c); card.classList.add("lift");
  if (card.classList.contains("cmp") && c.inRow) { c.inRow = false; uncompact(c); }
  const dx = ev.clientX - c.x, dy = ev.clientY - c.y, B = bounds(c), track = [[ev.clientX, ev.clientY, ev.timeStamp]];
  const move = m => {
    if (m.pointerId !== ev.pointerId) return;
    track.push([m.clientX, m.clientY, m.timeStamp]); while (track.length > 2 && m.timeStamp - track[0][2] > 100) track.shift();
    place(c, rubber(m.clientX - dx, B[0], B[1], innerWidth), rubber(m.clientY - dy, B[2], B[3], innerHeight));
  };
  const up = m => {
    card.classList.remove("lift"); h.removeEventListener("pointermove", move); h.removeEventListener("pointerup", up); h.removeEventListener("pointercancel", up);
    const a = track[0], b = track[track.length - 1], dt = Math.max(16, b[2] - a[2]);
    let vx = (b[0] - a[0]) / dt * 1000, vy = (b[1] - a[1]) / dt * 1000; if (m.timeStamp - b[2] > 80) vx = vy = 0;   // si se paró antes de soltar, no hay lanzamiento
    const tx = Math.min(B[1], Math.max(B[0], c.x + project(vx))), ty = Math.min(B[3], Math.max(B[2], c.y + project(vy)));

});
function cardClick(ev) {
  const card = ev.target.closest(".fic"); if (!card) return; const c = CARDS.get(card.dataset.key); if (!c) return;
  const row = ev.target.closest("tr[data-id]"); if (row) { const r = row.getBoundingClientRect(); openCard("ean", row.dataset.id, { x: r.right, y: r.top }); return; }
  const a = ev.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;

  else if (act === "fold") { if (c.el.classList.contains("cmp")) uncompact(c); else foldOne(c); c.inRow = false; a.setAttribute("aria-label", c.el.classList.contains("cmp") ? "Desplegar ficha" : "Plegar ficha"); }

$("layer").addEventListener("click", cardClick); $("fichas-m").addEventListener("click", cardClick);
$("closeall").addEventListener("click", () => [...CARDS.keys()].forEach(closeCard));
function foldOne(c) {

}
$("tidy").addEventListener("click", () => {     // comparar: fichas plegadas en rejilla bajo la hoja del parlamento, que sigue entera a la vista
  const list = [...CARDS.values()].sort((a, b) => (a.type === b.type ? 0 : a.type === "ean" ? -1 : 1));
  if (!list.length) return;
  list.forEach(c => { c.el.classList.add("cmp"); c.el.style.setProperty("--mini-h", "0px"); });
  const body = Math.max(...list.map(c => c.el.offsetHeight));            // alto de la ficha plegada sin curva
  const top = $("hemi").closest(".parl").getBoundingClientRect().bottom + 16, left = 18;
  const step = 300 + 14, cols = Math.min(list.length, Math.max(1, Math.floor((innerWidth - 18 - left + 14) / step))), rows = Math.ceil(list.length / cols);
  const room = innerHeight - 18 - top, gap = 14;
  let mini = Math.min(112, Math.floor((room - (rows - 1) * gap) / rows - body));

  const stride = body + mini + gap;                                       // cada fila baja el alto real de la ficha más el hueco
  list.forEach((c, i) => {
    const m = c.el.querySelector(".mini");
    if (m) { if (mini) { m.removeAttribute("data-off"); c.el.style.setProperty("--mini-h", mini + "px"); requestAnimationFrame(() => drawMini(m.firstElementChild, byId.get(c.id))); } else m.setAttribute("data-off", ""); }
    c.inRow = true; front(c); setTimeout(() => springTo(c, left + (i % cols) * step, top + Math.floor(i / cols) * stride, { response: .5, damping: .9 }), i * 40);   // escalonadas: se leen como un gesto
  });

$("same").addEventListener("change", () => CARDS.forEach(c => { const m = c.el.querySelector("svg[data-mini]"); if (m) drawMini(m, byId.get(c.id)); }));
document.addEventListener("keydown", ev => {
  if (ev.key !== "Escape" || ev.target.closest("input")) return;

addEventListener("resize", thumbs);

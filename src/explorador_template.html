<title>Explorador del parlamento</title>
<style>
@font-face { font-family: "Schibsted Grotesk"; font-style: normal; font-weight: 400 900; font-display: swap; src: url(data:font/woff2;base64,/*__FONT__*/) format("woff2"); }
/* Layout: carta de tonos. Carril de filtros sobre cartulina a la izquierda; en blanco, la tira de pastillas de partido, el hemiciclo de chips
   y el histórico + proyección; a la derecha la ficha de cifras, trends y perfil político. Sin tarjetas: reglas de 1px y cambio de tono. */
:root {
  --surface: #FFFFFF; --paper: #E3E4E0; --paper-2: #D7D8D3; --ink: #151515; --ink-2: #46474A; --muted: #5E5F62; --line: #D2D3CE; --soft: #F1F1EE;
  --spine: #FFFFFF; --spine-ink: #151515; --spine-muted: #5E5F62; --spine-2: #F1F1EE; --label: #FFFFFF;
  --empate: #B7BCC4; --good: #0ca30c; --critical: #d03b3b;   /* estado fijo (dataviz): siempre con triángulo, nunca solo color */
  --r: 2px;                                                   /* esquina viva de chip: única medida de radio */
  --f: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif; --f-code: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-io: cubic-bezier(0.77, 0, 0.175, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --surface: #1A1B1D; --paper: #232427; --paper-2: #2E2F33; --ink: #EDEDEA; --ink-2: #C3C4C0; --muted: #9B9C99; --line: #36373B; --soft: #242528;
  --spine: #1A1B1D; --spine-ink: #EDEDEA; --spine-muted: #9B9C99; --spine-2: #26272A; --label: #26272B; --empate: #6E7380; color-scheme: dark; } }
:root[data-theme="dark"] {
  --surface: #1A1B1D; --paper: #232427; --paper-2: #2E2F33; --ink: #EDEDEA; --ink-2: #C3C4C0; --muted: #9B9C99; --line: #36373B; --soft: #242528;
  --spine: #1A1B1D; --spine-ink: #EDEDEA; --spine-muted: #9B9C99; --spine-2: #26272A; --label: #26272B; --empate: #6E7380; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--surface); color: var(--ink); font: 400 13px/1.45 var(--f); -webkit-font-smoothing: antialiased; overflow: hidden; }
::selection { background: var(--ink); color: var(--surface); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
button, input { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
input { caret-color: var(--ink); }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.press { transition: transform 160ms var(--ease-out), background-color 160ms ease, border-color 160ms ease, color 160ms ease, opacity 160ms ease; }
.press:active { transform: scale(.97); }

/* ── lomo del abanico: barra superior */
.top { background: var(--spine); color: var(--spine-ink); border-bottom: 2px solid var(--ink); display: flex; align-items: center; gap: 16px; padding: 10px 18px; min-width: 0; }
.brand { font: 800 15px/1.1 var(--f); letter-spacing: -.01em; white-space: nowrap; display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand > div { min-width: 0; }
.brand small { display: block; font: 450 12px/1.35 var(--f); letter-spacing: 0; color: var(--spine-muted); overflow: hidden; text-overflow: ellipsis; }
.brand .fan { display: grid; grid-template-columns: repeat(6, 4px); gap: 1px; height: 22px; flex: none; }
.brand .fan i { display: block; border-radius: 1px; }
.search { position: relative; flex: 1 1 320px; max-width: 520px; min-width: 0; }
.search input { width: 100%; background: var(--spine-2); border: 1px solid transparent; border-radius: var(--r); padding: 8px 12px 8px 32px; color: var(--spine-ink); transition: border-color 160ms ease; }
.search input:focus { border-color: var(--spine-muted); outline: none; }
.search input::placeholder { color: var(--spine-muted); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--spine-muted); }
.results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 14px 32px rgba(20,20,18,.20); max-height: 60vh; overflow: auto; z-index: 30; padding: 4px;
  transform-origin: top center; transition: opacity 150ms var(--ease-out), transform 150ms var(--ease-out); }
@starting-style { .results { opacity: 0; transform: translateY(-4px) scale(.98); } }
.results .grp { font: 700 12px/1 var(--f); color: var(--muted); padding: 10px 8px 4px; }
.results button { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 7px 8px; border-radius: var(--r); cursor: pointer; }
.results button.on { background: var(--soft); }
.results button span:last-child { color: var(--muted); white-space: nowrap; }
.chips { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; min-width: 0; flex: 1 1 auto; scrollbar-width: none; }
.fchip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; background: var(--spine-2); border: 0; color: var(--spine-ink); border-radius: var(--r); padding: 5px 6px 5px 9px; font-size: 12px; cursor: pointer; }
.fchip b { font-weight: 450; color: var(--spine-muted); }
.fchip i { font-style: normal; width: 16px; height: 16px; display: grid; place-items: center; color: var(--spine-muted); font-size: 14px; line-height: 1; }
.reset { white-space: nowrap; background: var(--ink); color: var(--surface); border: 0; border-radius: var(--r); padding: 8px 12px; font-weight: 700; cursor: pointer; }
.reset[disabled] { background: transparent; color: var(--spine-muted); box-shadow: inset 0 0 0 1px var(--line); cursor: default; }
.reset[disabled]:active { transform: none; }

/* ── cuerpo: cartulina | blanco | blanco */
.main { display: grid; grid-template-columns: 248px minmax(0, 1fr) 356px; min-height: 0; }
.col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.col + .col { border-left: 1px solid var(--line); }
.rail { background: var(--paper); border-left: 0; }
.card { min-height: 0; display: flex; flex-direction: column; }
.card + .card { border-top: 1px solid var(--line); }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 14px 16px 0; }
.card-h h2 { font: 800 15px/1.2 var(--f); letter-spacing: -.01em; margin: 0; color: var(--ink); }
.card-h span { color: var(--muted); font-size: 12px; }

/* ── filtros (sobre cartulina) */
.facets { overflow-y: auto; padding: 6px 8px 10px; flex: 1; }
.facet { border-bottom: 1px solid var(--paper-2); padding: 10px 8px; }
.facet:last-child { border-bottom: 0; }
.facet-h { display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: none; border: 0; width: 100%; padding: 0; font: 700 13px/1.2 var(--f); color: var(--ink); }
.facet-h em { font-style: normal; font-weight: 800; background: var(--ink); color: var(--paper); border-radius: var(--r); padding: 1px 5px; margin-left: 6px; font-size: 12px; }
.facet-h svg { color: var(--muted); flex: none; }
.facet input { width: 100%; margin-top: 8px; border: 1px solid var(--paper-2); background: var(--surface); border-radius: var(--r); padding: 6px 8px; font-size: 12px; color: var(--ink); }
.facet input::placeholder { color: var(--muted); }
.facet ul { list-style: none; margin: 6px 0 0; padding: 0; max-height: 170px; overflow-y: auto; }
.facet.closed ul, .facet.closed input { display: none; }
.facet[data-k="v"] ul { max-height: none; }
.facet li button { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; background: none; border: 0; padding: 4px 4px; border-radius: var(--r); cursor: pointer; text-align: left; font-size: 13px; color: var(--ink); }
.facet li button .bx { width: 13px; height: 13px; border: 1.5px solid var(--ink-2); border-radius: var(--r); display: grid; place-items: center; transition: background-color 160ms ease, border-color 160ms ease; }
.facet li button[aria-pressed="true"] .bx { background: var(--ink); border-color: var(--ink); }
.facet li button[aria-pressed="true"] .bx::after { content: ""; width: 7px; height: 3.5px; border: solid var(--paper); border-width: 0 0 1.8px 1.8px; transform: rotate(-45deg) translate(1px, -1px); }
.facet li button .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.facet li button .ct { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.facet li button.zero { opacity: .45; }
.dot { width: 10px; height: 10px; border-radius: 1px; flex: none; display: inline-block; }

/* ── la carta: tira de pastillas + hemiciclo de chips */
.chamber { flex: 0 0 auto; }
.tally { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 12px 16px 4px; }
.sw { display: grid; grid-template-rows: auto 1fr; padding: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--label); cursor: pointer; text-align: left; overflow: hidden; min-width: 0; }
.sw .blk { display: flex; align-items: flex-end; justify-content: space-between; padding: 7px 8px 6px; min-height: 44px; }
.sw .blk b { font: 800 24px/1 var(--f); letter-spacing: -.02em; }

.sw .lab small { font: 500 12px/1 var(--f); letter-spacing: .06em; color: var(--muted); padding-bottom: 3px; border-bottom: 1px solid var(--line); margin-bottom: 2px; }
.sw .lab { min-width: 0; padding: 6px 8px 7px; font: 800 12.5px/1.2 var(--f); color: var(--ink); display: flex; flex-direction: column; gap: 2px; transition: background-color 160ms ease, color 160ms ease; }
.sw .lab span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.4em; }
.sw .lab em { display: block; font-style: normal; font-weight: 450; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw.zero { opacity: .38; }
.sw[aria-pressed="true"] { border-color: var(--ink); }
.sw[aria-pressed="true"] .lab { background: var(--ink); color: var(--surface); }
.sw[aria-pressed="true"] .lab em, .sw[aria-pressed="true"] .lab small { color: var(--surface); }
.sw[aria-pressed="true"] .lab small { border-bottom-color: color-mix(in oklab, var(--surface) 30%, transparent); }
.sw[aria-pressed="true"] .lab em { opacity: .75; }
.hemi-body { padding: 4px 16px 6px; }
.hemi { width: 100%; height: auto; max-height: 29vh; display: block; }
.hemi .seat { cursor: pointer; }
.hemi .seats { animation: sweep 260ms var(--ease-out) both; }   /* un solo barrido del grupo: barato con 839 chips */
@keyframes sweep { from { clip-path: inset(0 100% 0 0); opacity: .4; } to { clip-path: inset(0 0 0 0); opacity: 1; } }
.hemi .big { font: 850 50px/1 var(--f); letter-spacing: -.03em; fill: var(--ink); }
.hemi .cap { font: 600 12px/1 var(--f); fill: var(--muted); }
.nb { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: var(--r); font: 800 12px/1 var(--f); font-style: normal; flex: none; }
.vlab { font-size: 12px; color: var(--muted); padding: 0 16px 6px; display: flex; justify-content: space-between; gap: 8px; }
.vlab b { color: var(--ink); font-weight: 700; white-space: nowrap; }
.vbar { display: flex; height: 10px; gap: 2px; margin: 0 16px 14px; }
.vbar i { display: block; min-width: 0; border-radius: 1px; transition: flex-grow 250ms var(--ease-out); }

/* ── pestañas */
.tabs { display: flex; gap: 18px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 12px 0 10px; font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 13px; white-space: nowrap; transition: color 160ms ease, border-color 160ms ease; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.pane { flex: 1; min-height: 0; overflow: auto; padding: 12px 16px 14px; }

/* ── histórico y proyección */
.ctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.lchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 4px 9px 4px 6px; font-size: 12px; cursor: pointer; color: var(--ink); }
.lchip[aria-pressed="false"] { color: var(--muted); }
.lchip[aria-pressed="false"] .nb, .lchip[aria-pressed="false"] svg { opacity: .35; }
.lchip svg { flex: none; }
#p-evo:not([hidden]) { display: flex; flex-direction: column; }
.chart { position: relative; flex: 1; min-height: 190px; }
.chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
.chart .grid line { stroke: var(--soft); } .chart .axis text { fill: var(--muted); font-size: 12px; }
.chart .fut { fill: var(--soft); }
.chart .futlab { fill: var(--muted); font-size: 12px; font-weight: 600; }
.chart path.ln { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .cross { stroke: var(--muted); stroke-dasharray: 2 3; }
.chart .hit { fill: var(--surface); stroke-width: 2; }
.tip, .ftip { pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; border-radius: var(--r); opacity: 0; transition: opacity 120ms ease; box-shadow: 0 10px 28px rgba(20,20,18,.24); }
.tip { position: absolute; padding: 8px 10px; z-index: 10; white-space: nowrap; }
.tip.on, .ftip.on { opacity: 1; }
.tip table { border-collapse: collapse; margin-top: 4px; } .tip td { padding: 1px 4px; } .tip td:last-child { text-align: right; }
.ftip { position: fixed; z-index: 40; padding: 6px 9px; max-width: 320px; }
.ftip b { display: block; font-weight: 700; }
.ftip span { opacity: .72; }

/* ── tablas */
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.t th { position: sticky; top: 0; background: var(--surface); font: 700 12px/1.2 var(--f); color: var(--muted); text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--ink); cursor: pointer; white-space: nowrap; }
.t th:first-child, .t td:first-child, .t th.l, .t td.l { text-align: left; }
.t td { padding: 6px; border-bottom: 1px solid var(--soft); text-align: right; white-space: nowrap; color: var(--ink); }
.t td.desc { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.t tbody tr { cursor: pointer; transition: background-color 120ms ease; }
.t tr.hl td { font-weight: 800; }
.t td.l:first-child { font-family: var(--f-code); font-size: 12px; }
.pn { display: inline-flex; align-items: center; gap: 6px; }
.dlt { display: inline-flex; align-items: center; gap: 4px; justify-content: flex-end; }
.dlt svg { flex: none; }

/* ── derecha: ficha de cifras */
.who { padding: 14px 16px 10px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 12px; align-items: center; }
.who .chipx { grid-row: span 2; width: 44px; height: 52px; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: grid; grid-template-rows: 1fr 14px; }
.who .chipx i { display: block; } .who .chipx span { background: var(--label); font: 800 9px/14px var(--f); text-align: center; color: var(--ink); }
.who.nochip { grid-template-columns: minmax(0, 1fr); }
.who h3 { font: 800 17px/1.2 var(--f); letter-spacing: -.01em; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.who p { margin: 3px 0 0; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kpis { margin: 0 16px 12px; border-top: 1px solid var(--ink); }
.kpis div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.kpis b { font: 800 19px/1.1 var(--f); letter-spacing: -.01em; color: var(--ink); text-align: right; grid-column: 2; grid-row: 1; }
.kpis span { font-size: 12px; color: var(--muted); line-height: 1.35; }
.kpis span:first-of-type { color: var(--ink); font-weight: 600; font-size: 12.5px; grid-column: 1; grid-row: 1; }
.kpis span:last-of-type { grid-column: 1 / -1; }
.kpis .dlt { justify-content: flex-start; color: var(--ink); font-weight: 700; }
.tr-tab { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
.tr-tab th { font: 700 12px/1.2 var(--f); color: var(--muted); text-align: right; padding: 4px 4px 7px; border-bottom: 1px solid var(--ink); }
.tr-tab th:first-child { text-align: left; }
.tr-tab td { padding: 6px 2px; white-space: nowrap; border-bottom: 1px solid var(--soft); text-align: right; color: var(--ink); }
.tr-tab th:first-child, .tr-tab td:first-child { width: 34%; }
.tr-tab td:first-child { text-align: left; white-space: normal; line-height: 1.3; }
.tr-tab td:first-child small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 12px; }
.tr-tab tr.me td { background: var(--soft); font-weight: 800; }
.note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.5; max-width: 62ch; }
.seg { display: flex; gap: 0; margin-bottom: 10px; border: 1px solid var(--ink); border-radius: var(--r); overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--surface); padding: 7px 4px; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--ink); }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--surface); }
svg.cmp { width: 100%; height: auto; display: block; max-height: 34vh; }
.cmp .al { font: 600 12px/1 var(--f); fill: var(--ink-2); }
.cmp .d { transition: transform 700ms var(--ease-io); cursor: default; }
.cmp .mk, .cmp .cent { transition: transform 700ms var(--ease-io); }
.match { display: grid; gap: 8px; margin-top: 12px; border-top: 1px solid var(--ink); padding-top: 10px; }
.match .r { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 12.5px; }
.match .r > span { color: var(--muted); font-size: 12px; }
.match .r b { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; color: var(--ink); min-width: 0; }
.match .r small { flex-basis: 100%; padding-left: 24px; font-weight: 400; color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); padding: 18px 4px; text-align: center; font-size: 13px; }

@media (hover: hover) and (pointer: fine) {
  .results button:hover { background: var(--soft); }
  .facet li button:hover { background: var(--paper-2); }
  .t tbody tr:hover td { background: var(--soft); }
  .sw:hover { border-color: var(--ink-2); }
  .lchip:hover { border-color: var(--ink-2); }
  .seg button:not([aria-selected="true"]):hover { background: var(--soft); }
  .tab:hover { color: var(--ink); }
  .fchip:hover i { color: var(--spine-ink); }
  .hemi .seat:hover { stroke: var(--ink); stroke-width: 1.5; }
}
@media (max-width: 1180px) { .main { grid-template-columns: 220px minmax(0, 1fr) 320px; } .tally { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 960px) {
  body { overflow: auto; } .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); } .col + .col { border-left: 0; border-top: 1px solid var(--line); }
  .card.grow { min-height: 420px; } .top { flex-wrap: wrap; } .chips { order: 3; flex-basis: 100%; }
  .tally { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .brand small { white-space: normal; } .chamber .card-h { flex-direction: column; gap: 2px; }
  .chart { height: 300px; } .pane { max-height: 520px; }
}
@media (prefers-reduced-motion: reduce) {
  .hemi .seats { animation: fadeOnly 150ms ease both; }
  @keyframes fadeOnly { from { opacity: 0; } }
  .cmp .d, .cmp .mk, .cmp .cent, .vbar i, .press, .results { transition: opacity 150ms ease; }
  .press:active { transform: none; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span class="fan" id="fan" aria-hidden="true"></span>
      <div>Explorador del parlamento<small id="sub"></small></div></div>
    <div class="search"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Buscar EAN, línea, casa, tamaño…" autocomplete="off" aria-label="Buscar en todos los filtros">
      <div class="results" id="results" hidden></div></div>
    <div class="chips" id="chips"></div>
    <button class="reset press" id="reset" type="button" disabled>Todo el parlamento</button>
  </header>
  <div class="main">
    <aside class="col rail"><div class="card" style="flex:1"><div class="card-h"><h2>Filtros</h2><span id="nsel"></span></div><div class="facets" id="facets"></div></div></aside>
    <section class="col">
      <div class="card chamber">
        <div class="card-h"><h2 id="hemi-t">El parlamento</h2><span>Pulsa un partido para filtrar o un escaño para ver su EAN</span></div>
        <div class="tally" id="tally"></div>
        <div class="hemi-body"><svg class="hemi" id="hemi" role="img" aria-label="Hemiciclo de la selección"></svg></div>
        <div class="vlab"><span>Volumen de los últimos 12 meses (sep-25 a ago-26) de los EANs que elige cada partido</span><b id="vtot"></b></div>
        <div class="vbar" id="vbar"></div>
      </div>
      <div class="card grow" style="flex:1">
        <div class="tabs" role="tablist" id="ctabs">

/* ── hemiciclo: misma geometría que src/votes_report.seats.

const SEATS = new Map();

  if (SEATS.has(n)) return SEATS.get(n);

    const opts = [];

    ok.sort((a, b) => b[0] - a[0] || b[1] - a[1] || b[2] - a[2]);

    for (const i of rest.slice(0, n - k.reduce((a, b) => a + b, 0))) k[i]++;

    radii.forEach((r, ri) => { for (let j = 0; j < k[ri]; j++) pts.push([k[ri] > 1 ? Math.PI * (1 - j / (k[ri] - 1)) : Math.PI / 2, r]); });
    pts.sort((a, b) => b[0] - a[0] || a[1] - b[1]);

/* ── perfil político */
const CSPEC = [
  { k: "c1", t: "¿De dónde parto?", xl: ["Plana", "Con temporada"], yl: ["Reciente (6M)", "Lejana (12M)"] },
  { k: "c2", t: "¿A quién sigo?", xl: ["Individual", "Colectivo"], yl: ["Trend suave", "Trend completo"] },
  { k: "c3", t: "¿Cómo limpio?", xl: ["Deja los DAs", "Resta DAs"], yl: ["No suma cortes", "Suma cortes"] }];
function drawPol(list) {
  const pane = $("p-pol"), withPos = list.filter(e => e.pos);

    g0.append(el("line", { x1: X(0), x2: X(0), y1: mt, y2: mt + PH, stroke: "var(--line)" }), el("line", { x1: ml, x2: ml + PW, y1: Y(0), y2: Y(0), stroke: "var(--line)" }));

    const c = el("g", { class: "cent" }); c.dataset.tip = "Centro de la selección|ponderado por volumen"; c.append(el("path", { d: "M0 -11L11 0L0 11L-11 0Z", fill: "var(--ink)", stroke: "var(--surface)", "stroke-width": 2 })); svg.append(c);

  }

  set("xl0", { x: ml, y: h - 6 }, "← " + sp.xl[0]); set("xl1", { x: ml + PW, y: h - 6, "text-anchor": "end" }, sp.xl[1] + " →");

      c.dataset.id = e.id; c.dataset.tip = `${e.d}|${e.v}`; frag.append(c);
    });

  }
  const byId = new Map(withPos.map(e => [e.id, e]));

  ].map(([a, p, s]) => `<div class="r"><span>${a}</span><b title="${esc(s)}">${p in COL ? nb(p) : ""}${esc(p)} <small>${esc(s)}</small></b></div>`).join("")

}

  const list = sel(), A = aggregate(list); cur = { list, A };
  $("reset").disabled = !hasFilter();
  $("chips").innerHTML = (S.ean ? [["ean", S.ean, "EAN " + S.ean]] : []).concat(Object.entries(S.f).flatMap(([k, s]) => [...s].map(v => [k, v, lab(k, v)])))
    .map(([k, v, l]) => `<button class="fchip press" type="button" data-k="${esc(k)}" data-v="${esc(v)}">${k !== "ean" ? `<b>${FACETS.find(f => f[0] === k)[1]}:</b> ` : ""}${esc(l)}<i aria-label="Quitar"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2L8 8M8 2L2 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></i></button>`).join("");
  $("nsel").textContent = `${list.length} de ${PARL.length} EANs`;
  $("hemi-t").textContent = hasFilter() ? (S.ean ? "Su escaño" : "El parlamento de la selección") : "El parlamento";
  drawHemi(list); drawTally(list); drawFacets(); drawWho(list, A);
  for (const p in PANES) { if (VIS.has(p)) { DIRTY.delete(p); PANES[p](list, A); } else DIRTY.add(p); }
}
$("sub").textContent = `Foto sep-26 · proyección oct-26 a jun-27 · voto con FY26 · ${PARL.length} EANs`;
drawLines(); render();
</script>
